name: Feature request
description: Suggest something yapping should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        One rule shapes every feature here: nothing may leave the machine.
        Requests that need a cloud service will be declined, but a local
        equivalent is usually possible, so describe the outcome you want.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation you are in when you wish yapping did this.
      placeholder: "When I dictate into my editor, I want ..."
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: How you imagine it working. Rough is fine.
    validations:
      required: false

  - type: checkboxes
    id: local
    attributes:
      label: Privacy check
      options:
        - label: This can work without sending anything off the machine (or I have explained why it cannot)
          required: false
